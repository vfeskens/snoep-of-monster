const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function ontsleutel(wachtwoord) {
  const basis = await crypto.subtle.importKey('raw', new TextEncoder().encode(wachtwoord), 'PBKDF2', false, ['deriveKey']);
  const sleutel = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' },
                                                basis, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(DATA.iv) }, sleutel, bytes(DATA.ct)));
  try { localStorage.setItem('wachtwoord', wachtwoord); } catch {}   // volgende keer niet opnieuw intikken
  document.open(); document.write(html); document.close();
}
formulier.onsubmit = e => {
  e.preventDefault();
  fout.textContent = 'Even geduld...';
  ontsleutel(invoer.value).catch(() => fout.textContent = 'Dat wachtwoord klopt niet. Probeer nog eens!');
};
try { const w = localStorage.getItem('wachtwoord'); if (w) ontsleutel(w).catch(() => {}); } catch {}
